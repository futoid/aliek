
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>grep - aliek</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="blog-page">
    <div class="blog-container">
      <h1 style="font-size: clamp(2rem, 5vw, 3rem)">
        Low-effort, high-interest stuff
      </h1>
      <a href="/" style="color: #ccc">← Back to home</a>

          

      <div class="filter-buttons">
        <button class="filter-btn active" data-tag="all">All</button>
        
        <button class="filter-btn" data-tag="aliek">aliek</button>
        
      </div>

      
      <div class="blog-card" data-topic="aliek">
        <h2>
          <a href="/get/aliek/" style="color: #fff; text-decoration: none"
            >My carbon footprint</a
          >
        </h2>
        <div class="blog-meta">
          <span>By aliek</span> |
          <span>February 01, 2026</span> |
          <span class="blog-tag">aliek</span>
        </div>
        <p>thinking to add random stuffs</p>
      </div>
      
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const filterButtons = document.querySelectorAll(".filter-btn");
        filterButtons.forEach((btn) => {
          btn.addEventListener("click", () => {
            // Remove active class
            filterButtons.forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            const tag = btn.dataset.tag;
            const cards = document.querySelectorAll(".blog-card");
            cards.forEach((card) => {
              if (tag === "all" || card.dataset.topic === tag) {
                card.style.display = "block";
              } else {
                card.style.display = "none";
              }
            });
          });
        });
      });
    </script>
  </body>
</html>
